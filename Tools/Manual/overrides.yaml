# Hand-kept values for gen_reference.py: things the headers do not say, the order of the reference
# chapters, and which edition each step and feature belongs to. Text here ends up in the manual, so the
# same writing rules apply (lint_manual.py checks this file too).

# Order of the steps inside their groups. Every concrete step class of the plugin must be listed.
step_order:
  - UFeelStep_ProceduralShake
  - UFeelStep_CameraPunch
  - UFeelStep_FOVKick
  - UFeelStep_CameraRoll
  - UFeelStep_CameraZoom
  - UFeelStep_LookAtNudge
  - UFeelStep_GlobalHitstop
  - UFeelStep_ActorHitstop
  - UFeelStep_SlowMoRamp
  - UFeelStep_ScreenFlash
  - UFeelStep_VignettePulse
  - UFeelStep_ChromaticAberration
  - UFeelStep_Desaturate
  - UFeelStep_ColorTint
  - UFeelStep_ScreenFade
  - UFeelStep_PostProcessMaterialPulse
  - UFeelStep_ScalePunch
  - UFeelStep_SquashStretch
  - UFeelStep_MaterialPulse
  - UFeelStep_HitFlash
  - UFeelStep_MeshWobble
  - UFeelStep_LightFlash
  - UFeelStep_PlaySound
  - UFeelStep_SoundClassDuck
  - UFeelStep_PitchBend
  - UFeelStep_LowPassSweep
  - UFeelStep_ForceFeedbackCurve
  - UFeelStep_HapticPattern
  - UFeelStep_WidgetPunch
  - UFeelStep_WidgetShake
  - UFeelStep_WidgetFlash
  - UFeelStep_NumberPop
  - UFeelStep_SpawnDecal
  - UFeelStep_SpawnParticle
  - UFeelStep_Recipe
  - UFeelStep_RandomChoice
  - UFeelStep_BlueprintEvent

# Step groups, found from each step's default channel.
step_groups:
  - {key: camera, title: Camera steps, channels: [Feel.Camera]}
  - {key: time, title: Time steps, channels: [Feel.Time]}
  - {key: screen, title: Screen steps, channels: [Feel.Screen]}
  - {key: actor, title: Actor steps, channels: [Feel.Actor]}
  - {key: audio, title: Audio steps, channels: [Feel.Audio]}
  - {key: haptics, title: Haptics steps, channels: [Feel.Haptics]}
  - {key: ui, title: UI steps, channels: [Feel.UI]}
  - {key: spawn, title: Spawn steps, channels: [Feel.Spawn]}
  - {key: meta, title: Meta steps, channels: [Feel.Meta]}

# Everything listed here is in FeelKit Lite and in FeelKit Pro. Everything else is Pro only.
