# Fields that are Pro only inside tables that are otherwise in both editions.
pro_fields:
  - UFeelRecipe.Parameters
  - UFeelRecipe.bSustain
  - UFeelRecipe.SustainStart
  - UFeelRecipe.SustainEnd
  - UFeelRecipe.Feeling
  - UFeelRecipe.Genres
  - UFeelRecipe.Description
  - UFeelRecipe.BasedOn
  - FFeelTrack.AppliesTo
  - FFeelTrack.ParameterMappings
  - FFeelTrack.RandomIntensity
  - FFeelTrack.RandomDurationScale
  - FFeelConditions.bLocalPlayerOnly
  - FFeelConditions.MaxDistance
  - FFeelConditions.Chance
  - FFeelConditions.Platforms
  - UFeelSettings.bAllowGlobalTimeDilationInMultiplayer
  - UFeelSettings.Accumulators

# Defaults the headers cannot show on their own. Keys are Class.Property.
defaults:
  UFeelSettings.ComfortMenuClass: "`WBP_FeelComfortMenu` (in **FeelKit Content** > **UI**)"
  UFeelRecipe.Tracks: "empty (edited on the timeline)"
  FFeelTrack.Step: "None (chosen with **+ Track**)"
  FFeelTrack.Channel: "the step's default channel"
  FFeelTrack.IntensityCurve: "fades from 1 to 0"
  FFeelTrack.SubstituteStep: "None"
  FFeelParameterMapping.Curve: "straight line from 0 to 1"
  UFeelStep_MaterialPulse.Parameters: "one entry with the defaults below"
  AFeelSwitch.SwitchKeys: "Tab, Gamepad Special Left"
  AFeelSwitch.ComfortMenuKeys: "O, Gamepad Special Right"
  UFeelSettings.DefaultComfortScales: "every scale 1 (see the comfort scale tables)"
  UFeelSettings.ChannelComfortGroups: "nine entries (see the table below)"
  UFeelSettings.ReducedMotionPreset: "see the comfort scale tables"
  UFeelSettings.ReducedFlashingPreset: "see the comfort scale tables"
  UFeelSettings.NoHapticsPreset: "see the comfort scale tables"
  UFeelComfortPreset.Scales: "every scale 1"
  FFeelRandomChoiceOption.Step: "None"

# Units the headers leave to the tooltip text.
units:
  UFeelStep_ProceduralShake.LocationAmplitude: cm
  UFeelStep_ProceduralShake.RotationAmplitude: "°"
  UFeelStep_CameraPunch.LocationPunch: cm
  UFeelStep_CameraPunch.RotationPunch: "°"
  UFeelStep_MeshWobble.TiltAmplitude: "°"
  UFeelStep_MeshWobble.MoveAmplitude: cm
  UFeelStep_SpawnDecal.DecalSize: cm
  UFeelStep_NumberPop.WorldOffset: cm
  UFeelStep_NumberPop.RiseDistance: slate units
  UFeelStep_NumberPop.Spread: slate units
  UFeelStep_WidgetShake.Amplitude: slate units
  UFeelStep_WidgetPunch.Translation: slate units
  FFeelComfortScales.MaxFieldOfViewChangePerSecond: "°/s"

# Array properties that get no table of their own entries here.
no_subtable:
  - UFeelRecipe.Tracks
  - UFeelSettings.DefaultComfortScales
  - UFeelSettings.ReducedMotionPreset
  - UFeelSettings.ReducedFlashingPreset
  - UFeelSettings.NoHapticsPreset
  - UFeelComfortPreset.Scales

# Replacement descriptions where the tooltip alone would mislead in the manual.
descriptions:
  FFeelTrack.IntensityCurve: "Intensity over the track's normalized time, from 0 at its start to 1 at its end. An empty curve means a constant 1. New tracks of steps that shape their own motion start with a flat curve at 1."
  FFeelTarget.Actor: "Target actor when Type is Actor."
  FFeelTarget.Component: "Target component when Type is Scene Component."
  FFeelTarget.Location: "World location when Type is World Location."
  FFeelTarget.LocalPlayerIndex: "Index of the local player when Type is Local Player Camera."
  FFeelTrack.bEnabled: "Editor mute. Disabled tracks produce no output, in the preview and in the game."

# Facts that depend on how a step is used rather than on one value in the source.
channel_notes:
  UFeelStep_RandomChoice: "the default channel of the first option's step, or `Feel.Meta.Recipe` when there is none"
comfort_notes:
  UFeelStep_CameraRoll: "Camera Motion; the roll is also removed completely when a player turns **Allow Camera Roll** off"
  UFeelStep_HapticPattern: "Haptics; comfort can switch the effect off (Haptics at 0) but cannot make it weaker"
  UFeelStep_Recipe: "none for the track itself; the inner recipe's tracks keep their own channels and comfort groups"
  UFeelStep_RandomChoice: "the group of the track's channel"
preview_notes:
  UFeelStep_PlaySound: "yes, the sound is audible"
  UFeelStep_Recipe: "yes, exactly like the inner recipe"
  UFeelStep_RandomChoice: "as the step of the option picked for the preview play"

